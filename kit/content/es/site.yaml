# Offlined WikiAula — textos generales del ZIM en español.
# (Los textos de la interfaz que usa el motor están en engine/i18n/es.js)

zim:
  title: Offlined WikiAula
  description: Cursos interactivos de Primaria, ESO y Bachillerato, sin conexión
  long_description: |
    Offlined WikiAula es un aula libre: cursos completos de Primaria, ESO y Bachillerato
    (grados 1 a 12) con lecciones al estilo de una enciclopedia y ejercicios
    interactivos que cambian cada vez. Cada lección tiene su nivel de dominio,
    hay pruebas por unidad, repaso espaciado, experiencia, rachas y logros.
    Funciona en cualquier lector de Kiwix; dentro de Offlined el progreso se
    guarda por usuario y Michael Knowledge, la IA de Offlined, ayuda con los ejercicios.
  creator: Offlined
  publisher: Offlined
  tags: _category:other;education;mathematics;_pictures:yes;_videos:no;_details:yes;_ftindex:yes
  source: https://www.offlined.org/
  license: CC BY-SA 4.0

