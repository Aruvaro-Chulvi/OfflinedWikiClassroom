portada:
  lema: Matemáticas, Física y Química a tu ritmo, sin conexión y gratis. De 1.º de Primaria a 2.º de Bachillerato.
  que_es_titulo: Qué es Offlined WikiAula
  que_es: |
    **Offlined WikiAula** es un aula completa que cabe en un solo archivo y funciona **sin
    internet**. Tiene **Matemáticas de 1.º de Primaria a 2.º de Bachillerato** y **Física y
    Química de 2.º de ESO a 2.º de Bachillerato**, escritos como artículos de enciclopedia: explicaciones claras, ejemplos
    resueltos paso a paso, ilustraciones y enlaces a Wikipedia para saber más. Después de
    cada lección hay ejercicios que **cambian cada vez**, así que se puede practicar sin
    aprenderse las respuestas de memoria.
  rasgos:
    - icono: wifi-off
      titulo: Sin conexión y gratis
      texto: Todo está dentro del archivo. No necesita internet, ni cuentas, ni anuncios, y se puede copiar y compartir.
    - icono: book
      titulo: Del colegio al instituto
      texto: Cientos de lecciones de Matemáticas, Física y Química, ordenadas por curso, con dibujos, fórmulas y ejemplos resueltos paso a paso.
    - icono: target
      titulo: Ejercicios que cambian
      texto: Cada práctica genera ejercicios nuevos y, si fallas, te enseña la solución paso a paso. Al final de cada unidad, una prueba con medalla.
    - icono: lock
      titulo: Tu progreso es tuyo
      texto: Tu nivel, tus rachas y tus repasos se guardan solo en tu equipo. Nadie más los ve ni se envían a ningún sitio.
  como_titulo: Cómo se aprende
  pasos:
    - titulo: Lee la lección
      texto: Cada lección se lee en 20–60 minutos. Empieza con una idea sencilla y la desarrolla con ejemplos, dibujos y pequeños ejercicios para comprobar que lo entiendes.
    - titulo: Practica
      texto: Ocho ejercicios cada vez, siempre distintos. Si te equivocas, ves por qué y cómo se resuelve. Cada acierto suma experiencia (XP).
    - titulo: Sube de nivel
      texto: "Cada lección pasa por cuatro niveles: Intentado, Familiar (50 %), Competente (80 %) y Dominado. Para dominarla hay que acertar también otro día: así lo aprendido se queda."
    - titulo: Repasa y gana medallas
      texto: Las lecciones que ya sabes vuelven a la página de Repaso unos días después, justo cuando empiezan a olvidarse. Supera la prueba de cada unidad para ganar su medalla.
  cursos: Cursos
  cursos_intro: Elige la etapa y después tu curso. Cada tarjeta es una asignatura; la barra muestra cuántas lecciones tienes dominadas.
  familias_titulo: Para familias y docentes
  familias: |
    - **En casa**: lo mejor es que los más pequeños lean las lecciones con un adulto y hagan los
      pequeños experimentos que se proponen. Desde 3.º o 4.º de Primaria pueden avanzar solos.
    - **En clase**: cada lección sirve como guía de la sesión y su práctica, como tarea. La página
      [[Mi progreso]] resume el avance de cada alumno en su equipo y permite guardar una copia.
    - **Contenidos libres**: los textos tienen licencia CC BY-SA 4.0 y las fotos vienen de
      Wikimedia Commons, con su autor y su licencia al pie (ver [[Acerca de Offlined WikiAula]]).
      Puedes copiarlos, adaptarlos y compartirlos citando la fuente.

offlined: >-
  **Offlined WikiAula brilla en [Offlined](https://www.offlined.org/)**, la app de
  conocimiento sin conexión: allí tu progreso se guarda en tu perfil (cada
  persona de la casa con el suyo), cada lección es una tarjeta de *Mi WikiÁlbum* y
  Michael Knowledge, su IA, te explica los ejercicios que fallas sin darte la respuesta.

textos:
  review: |
    Lo que se practica una sola vez se olvida. Aquí vuelven las lecciones que ya
    has practicado, cada vez más espaciadas en el tiempo: al día siguiente, a los
    tres días, a la semana… Si aciertas, el siguiente repaso tardará más; si
    fallas, volverá pronto.
  progress: |
    Tu experiencia, tu racha, tus cursos y tus logros.
  about: |
    **Offlined WikiAula** es un proyecto educativo libre: cursos de Primaria, ESO y
    Bachillerato escritos para estudiar sin conexión a Internet.

    ## Contenido

    Las lecciones son originales y siguen los contenidos habituales de cada
    curso en Europa y América (grados internacionales 1 a 12). Los ejercicios se
    generan al momento, así que nunca se repiten igual. Puedes consultar más
    información en los enlaces a Wikipedia de cada lección.

    ## Tu progreso

    En un lector de Kiwix, tu progreso se guarda en el navegador o la app que
    estés usando. Si cambias de dispositivo o borras los datos del navegador, se
    pierde: usa los botones de [[Mi progreso]] para guardar una copia y
    cargarla después. En Offlined se guarda en tu perfil de usuario.

    ## Licencia

    Los textos, ejercicios e imágenes de Offlined WikiAula están disponibles bajo la
    licencia [Creative Commons Atribución-CompartirIgual 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.es).
    Puedes copiarlos, adaptarlos y compartirlos, también con fines comerciales,
    siempre que cites a Offlined WikiAula y compartas tus cambios con la misma licencia.
    Offlined WikiAula no está relacionada con la Fundación Wikimedia ni con Wikipedia.

    Las fórmulas se muestran con [KaTeX](https://katex.org/) (licencia MIT,
    © Khan Academy y colaboradores), incluido en este archivo junto con su
    licencia (`_aula/katex/LICENSE.txt`).

